  - heading "5. Access Control" [level=2] [ref=e78]
  - heading "Principles" [level=3] [ref=e79]
  - list [ref=e80]:
    - listitem [ref=e81]:
      - strong [ref=e82]: "Least Privilege:"
      - text: Every account and service is granted the minimum permissions required to perform its function.
    - listitem [ref=e83]:
      - strong [ref=e84]: "No Shared Accounts:"
      - text: Each person and service uses a unique identity.
    - listitem [ref=e85]:
      - strong [ref=e86]: "MFA Required:"
      - text: Multi-factor authentication is enabled on all critical accounts, including Vercel, Supabase, Stripe, GitHub, and DNS providers.
  - heading "Authentication Standards" [level=3] [ref=e87]
  - list [ref=e88]:
    - listitem [ref=e89]: All administrative access requires MFA (TOTP or hardware key).
    - listitem [ref=e90]: NextAuth.js manages customer authentication with secure, httpOnly session cookies.
    - listitem [ref=e91]: API keys are scoped to the minimum permissions necessary.
    - listitem [ref=e92]: Service-to-service communication uses environment-injected secrets, never hardcoded credentials.
  - heading "Access Reviews" [level=3] [ref=e93]
  - paragraph [ref=e94]: Access to all systems is reviewed quarterly. Unused accounts and stale API keys are revoked promptly.
  - heading "6. Encryption Standards" [level=2] [ref=e95]
  - heading "Data in Transit" [level=3] [ref=e96]
  - list [ref=e97]:
    - listitem [ref=e98]: All traffic is encrypted via TLS 1.2 or higher.
    - listitem [ref=e99]: HSTS is enforced on all domains.
    - listitem [ref=e100]: Vercel provides automatic TLS certificate provisioning and renewal.
  - heading "Data at Rest" [level=3] [ref=e101]
  - list [ref=e102]:
    - listitem [ref=e103]: Supabase (PostgreSQL) encrypts all data at rest using AES-256.
    - listitem [ref=e104]: Vercel environment variables are encrypted at rest.
    - listitem [ref=e105]: Stripe handles all payment card data; no card numbers are stored or processed by COOKIE-BANNER.CA systems.
  - heading "Secrets Management" [level=3] [ref=e106]
  - list [ref=e107]:
    - listitem [ref=e108]: Secrets are stored exclusively in Vercel environment variables and Supabase vault.
    - listitem [ref=e109]:
      - text: Secrets are never committed to version control. The
      - code [ref=e110]: .gitignore
      - text: file excludes
      - code [ref=e111]: .env*
      - text: files.
    - listitem [ref=e112]: Secrets are rotated at least annually, or immediately upon suspected compromise.
  - heading "7. Infrastructure and Third-Party Risk Management" [level=2] [ref=e113]
  - paragraph [ref=e114]: COOKIE-BANNER.CA does not operate its own servers or data centers. All infrastructure is provided by third-party vendors selected for their security certifications and practices.
