        - cell "SOC 2 Type II" [ref=e145]
  - heading "Vendor Assessment" [level=3] [ref=e146]
  - list [ref=e147]:
    - listitem [ref=e148]: Vendor security certifications are verified before adoption and reviewed annually.
    - listitem [ref=e149]: Only vendors with established security programs and publicly available compliance documentation are selected.
    - listitem [ref=e150]: Data processing agreements (DPAs) are executed with vendors that process personal data.
  - heading "Dependency Management" [level=3] [ref=e151]
  - list [ref=e152]:
    - listitem [ref=e153]: Application dependencies are monitored for known vulnerabilities via GitHub Dependabot.
    - listitem [ref=e154]: Critical security patches are applied within 72 hours of disclosure.
  - heading "8. Incident Response" [level=2] [ref=e155]
  - paragraph [ref=e156]: "In the event of a suspected security incident:"
  - list [ref=e157]:
    - listitem [ref=e158]:
      - strong [ref=e159]: Contain
      - text: – Immediately revoke compromised credentials and isolate affected systems.
    - listitem [ref=e160]:
      - strong [ref=e161]: Assess
      - text: – Determine the scope and severity of the incident.
    - listitem [ref=e162]:
      - strong [ref=e163]: Notify
      - text: – Inform affected customers and relevant supervisory authorities within the timelines required by applicable law (72 hours under GDPR, as soon as feasible under PIPEDA/Law 25).
    - listitem [ref=e164]:
      - strong [ref=e165]: Remediate
      - text: – Fix the root cause and restore normal operations.
    - listitem [ref=e166]:
      - strong [ref=e167]: Document
      - text: – Record the incident, timeline, impact, and corrective actions taken.
  - paragraph [ref=e168]: Security incidents can be reported to security@cookie-banner.ca.
  - heading "9. Secure Development Practices" [level=2] [ref=e169]
  - list [ref=e170]:
    - listitem [ref=e171]: All code changes go through pull request review before merging to production.
    - listitem [ref=e172]: Environment variables are used for all configuration and secrets; nothing is hardcoded.
    - listitem [ref=e173]: Input validation is performed on all API endpoints using Zod schema validation.
    - listitem [ref=e174]: Dependencies are kept up to date and audited for known vulnerabilities.
    - listitem [ref=e175]: Production deployments are managed through Vercel’s CI/CD pipeline with automatic preview environments.
  - heading "10. Business Continuity" [level=2] [ref=e176]
  - list [ref=e177]:
    - listitem [ref=e178]:
      - strong [ref=e179]: "Database Backups:"
      - text: Supabase performs automated daily backups with point-in-time recovery.
    - listitem [ref=e180]:
      - strong [ref=e181]: "Source Code:"
      - text: All code is stored in a private GitHub repository with full version history.
    - listitem [ref=e182]:
      - strong [ref=e183]: "Service Availability:"
      - text: Vercel’s edge network provides global redundancy and automatic failover.
    - listitem [ref=e184]:
      - strong [ref=e185]: "Disaster Recovery:"
      - text: In the event of a provider outage, the application can be redeployed to an alternative provider using the source code and database backups.
  - heading "11. Security Awareness" [level=2] [ref=e186]
  - list [ref=e187]:
    - listitem [ref=e188]: The founder maintains current knowledge of security best practices, privacy regulations, and emerging threats relevant to web application security and consent management.
    - listitem [ref=e189]: If the team grows, all personnel with access to company systems will complete security awareness orientation before gaining access, with annual refreshers thereafter.
  - heading "12. Regulatory Compliance" [level=2] [ref=e190]
  - paragraph [ref=e191]: "COOKIE-BANNER.CA processes personal data in compliance with:"
  - list [ref=e192]:
    - listitem [ref=e193]:
      - strong [ref=e194]: GDPR
      - text: (EU General Data Protection Regulation)
    - listitem [ref=e195]:
      - strong [ref=e196]: PIPEDA
      - text: (Canada’s Personal Information Protection and Electronic Documents Act)
    - listitem [ref=e197]:
      - strong [ref=e198]: Law 25
      - text: (Quebec’s Act respecting the protection of personal information in the private sector)
    - listitem [ref=e199]:
      - strong [ref=e200]: PECR
      - text: (UK Privacy and Electronic Communications Regulations)
  - paragraph [ref=e201]: Data subject access requests, deletion requests, and consent withdrawal requests are honored within the timelines required by each applicable regulation.
  - heading "13. Policy Review" [level=2] [ref=e202]
  - paragraph [ref=e203]: "This policy is reviewed and updated:"
  - list [ref=e204]:
    - listitem [ref=e205]:
      - strong [ref=e206]: Annually
      - text: ", on or before the anniversary of the effective date."
    - listitem [ref=e207]:
      - strong [ref=e208]: Upon significant change
      - text: ", such as a new infrastructure provider, a material change in data processing, or a security incident."
    - listitem [ref=e209]:
      - strong [ref=e210]: Upon regulatory change
      - text: ", when new laws or amendments affect the company’s obligations."
  - paragraph [ref=e211]: All revisions are documented with a version number and effective date.
