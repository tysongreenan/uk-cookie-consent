  - separator [ref=e9]
  - heading "1. Purpose" [level=2] [ref=e10]
  - paragraph [ref=e11]: This policy establishes the information security principles, standards, and responsibilities for COOKIE-BANNER.CA, a cookie consent management platform (CMP). It applies to all systems, data, and services operated by the organization.
  - paragraph [ref=e12]: COOKIE-BANNER.CA is a solo-founder, fully remote SaaS company with no physical office or self-managed data center. Our security posture relies on carefully selected infrastructure providers, strong access controls, and disciplined operational practices rather than on-premises security measures.
  - heading "2. Scope" [level=2] [ref=e13]
  - paragraph [ref=e14]: "This policy covers:"
  - list [ref=e15]:
    - listitem [ref=e16]: All production systems and environments (application, database, payment processing)
    - listitem [ref=e17]: All customer data, including consent records and account information
    - listitem [ref=e18]: All third-party services integrated into the platform
    - listitem [ref=e19]: The founder and any future contractors or employees with access to company systems
  - heading "3. Roles and Responsibilities" [level=2] [ref=e20]
