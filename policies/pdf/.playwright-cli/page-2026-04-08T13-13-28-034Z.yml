  - heading "4. Detection and Reporting" [level=2] [ref=e100]
  - heading "Detection Sources" [level=3] [ref=e101]
  - list [ref=e102]:
    - listitem [ref=e103]: Vercel deployment logs and function logs
    - listitem [ref=e104]: Supabase dashboard alerts (auth anomalies, query patterns)
    - listitem [ref=e105]: Stripe webhook failure notifications
    - listitem [ref=e106]: Uptime monitoring (external service)
    - listitem [ref=e107]: Customer reports to security@cookie-banner.ca
    - listitem [ref=e108]: GitHub security advisories and Dependabot alerts
    - listitem [ref=e109]: Manual review of access logs
  - heading "Reporting" [level=3] [ref=e110]
  - paragraph [ref=e111]:
    - text: Anyone (customers, partners, the founder) who suspects an incident should email
    - strong [ref=e112]: security@cookie-banner.ca
    - text: "immediately. All incidents are logged in a dedicated incident register with:"
  - list [ref=e113]:
    - listitem [ref=e114]: Date/time of detection
    - listitem [ref=e115]: Description and initial severity classification
    - listitem [ref=e116]: Systems and data potentially affected
    - listitem [ref=e117]: Actions taken
  - separator [ref=e118]
  - heading "5. Response Procedures" [level=2] [ref=e119]
  - heading "5.1 Contain" [level=3] [ref=e120]
  - paragraph [ref=e121]:
    - strong [ref=e122]: "Goal:"
    - text: Stop the incident from spreading.
  - list [ref=e123]:
    - listitem [ref=e124]: Revoke or rotate compromised credentials (Supabase keys, NextAuth secrets, Stripe API keys, Vercel tokens)
    - listitem [ref=e125]: If unauthorized database access is suspected, enable Supabase network restrictions or pause the project
    - listitem [ref=e126]: Revoke active user sessions if auth is compromised
    - listitem [ref=e127]: If a Vercel deployment is compromised, roll back to the last known-good deployment
    - listitem [ref=e128]: Enable maintenance mode if necessary to protect customer data
  - heading "5.2 Eradicate" [level=3] [ref=e129]
  - paragraph [ref=e130]:
    - strong [ref=e131]: "Goal:"
    - text: Remove the root cause.
  - list [ref=e132]:
    - listitem [ref=e133]: Identify the attack vector (e.g., compromised dependency, leaked environment variable, social engineering)
    - listitem [ref=e134]: Remove malicious code, unauthorized accounts, or backdoors
    - listitem [ref=e135]: Patch the vulnerability or misconfiguration
    - listitem [ref=e136]: Rotate all credentials that may have been exposed, even if not confirmed compromised
    - listitem [ref=e137]: Update dependencies if a supply-chain vulnerability is involved
  - heading "5.3 Recover" [level=3] [ref=e138]
  - paragraph [ref=e139]:
    - strong [ref=e140]: "Goal:"
    - text: Restore normal operations with confidence.
  - list [ref=e141]:
    - listitem [ref=e142]: Deploy verified clean code to Vercel
    - listitem [ref=e143]: Restore database from Supabase point-in-time recovery if data integrity is in question
    - listitem [ref=e144]: Re-enable services incrementally; monitor closely for recurrence
    - listitem [ref=e145]: Verify payment processing is functioning correctly via Stripe dashboard
    - listitem [ref=e146]: Confirm customer-facing banner delivery is operating normally
    - listitem [ref=e147]: Remove maintenance mode
  - separator [ref=e148]
  - heading "6. Evidence Preservation" [level=2] [ref=e149]
  - paragraph [ref=e150]: "From the moment an incident is suspected:"
  - list [ref=e151]:
    - listitem [ref=e152]:
      - strong [ref=e153]: Do not delete or modify logs.
      - text: Export and preserve Vercel function logs, Supabase query logs, and Stripe event logs.
    - listitem [ref=e154]: Take screenshots of dashboards, error messages, and anomalous activity.
    - listitem [ref=e155]: Record all timestamps in UTC.
    - listitem [ref=e156]: Document every action taken during the response, including who did what and when.
    - listitem [ref=e157]: Preserve email headers and full content if phishing or social engineering is involved.
    - listitem [ref=e158]: Store all evidence in a dedicated, access-controlled folder separate from production systems.
  - paragraph [ref=e159]:
    - text: Evidence must be retained for a minimum of
    - strong [ref=e160]: 5 years
    - text: to satisfy regulatory requirements.
  - separator [ref=e161]
  - heading "7. Breach Notification Requirements" [level=2] [ref=e162]
  - heading "7.1 GDPR (EU/EEA Data Subjects)" [level=3] [ref=e163]
  - list [ref=e164]:
    - listitem [ref=e165]:
      - text: Notify the relevant
      - strong [ref=e166]: Supervisory Authority
      - text: within
      - strong [ref=e167]: 72 hours
      - text: of becoming aware of a personal data breach, unless the breach is unlikely to result in a risk to individuals.
    - listitem [ref=e168]:
      - text: If the breach poses a
      - strong [ref=e169]: high risk
      - text: to individuals, notify affected data subjects
      - strong [ref=e170]: without undue delay
      - text: .
    - listitem [ref=e171]: Document all breaches in the internal breach register regardless of notification obligation.
  - heading "7.2 PIPEDA (Canada – Federal)" [level=3] [ref=e172]
  - list [ref=e173]:
    - listitem [ref=e174]:
      - text: Report breaches involving personal information that create a
      - strong [ref=e175]: real risk of significant harm
      - text: to the
      - strong [ref=e176]: Office of the Privacy Commissioner of Canada (OPC)
      - text: as soon as feasible.
    - listitem [ref=e177]: Notify affected individuals as soon as feasible.
    - listitem [ref=e178]: Notify any third-party organizations that may be able to reduce risk of harm.
    - listitem [ref=e179]:
      - text: Maintain breach records for
      - strong [ref=e180]: 2 years
      - text: .
  - heading "7.3 Quebec Law 25 (Canada – Quebec)" [level=3] [ref=e181]
  - list [ref=e182]:
    - listitem [ref=e183]:
      - text: Notify the
      - strong [ref=e184]: Commission d’acces a l’information du Quebec (CAI)
      - text: of any
      - strong [ref=e185]: confidentiality incident
      - text: involving personal information that presents a
      - strong [ref=e186]: risk of serious injury
      - text: .
    - listitem [ref=e187]: Notify affected individuals as soon as feasible.
    - listitem [ref=e188]: Maintain an incident register and provide it to the CAI upon request.
  - heading "7.4 PECR / UK GDPR (UK Data Subjects)" [level=3] [ref=e189]
  - list [ref=e190]:
    - listitem [ref=e191]:
      - text: Notify the
      - strong [ref=e192]: Information Commissioner’s Office (ICO)
      - text: within
      - strong [ref=e193]: 72 hours
      - text: of becoming aware of a personal data breach that poses a risk to individuals.
    - listitem [ref=e194]: Notify affected individuals without undue delay if the breach poses a high risk.
  - heading "Notification Checklist" [level=3] [ref=e195]
  - list [ref=e196]:
    - listitem [ref=e197]:
      - generic [ref=e198]:
        - checkbox "Determine which jurisdictions and regulations apply based on affected data subjects" [ref=e199]
        - text: Determine which jurisdictions and regulations apply based on affected data subjects
    - listitem [ref=e200]:
