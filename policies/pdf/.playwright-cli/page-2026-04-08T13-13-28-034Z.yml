  - heading "1. Purpose and Scope" [level=2] [ref=e12]
  - paragraph [ref=e13]: This plan establishes procedures for detecting, responding to, and recovering from security incidents affecting COOKIE-BANNER.CA, a cookie consent management platform (CMP) serving customers under GDPR, PIPEDA, Quebec Law 25, and PECR.
  - paragraph [ref=e14]:
    - strong [ref=e15]: "In scope:"
    - text: "All production systems, customer data, internal accounts, and third-party integrations including:"
  - list [ref=e16]:
    - listitem [ref=e17]: Application layer (Next.js on Vercel)
    - listitem [ref=e18]: Database (Supabase / PostgreSQL)
    - listitem [ref=e19]: Payment processing (Stripe)
    - listitem [ref=e20]: Authentication (NextAuth.js)
    - listitem [ref=e21]: DNS, domain registrar, and email accounts
    - listitem [ref=e22]: Source code repositories
  - paragraph [ref=e23]:
    - strong [ref=e24]: "Out of scope:"
    - text: Physical security (fully virtual organization, no offices or data centers). Infrastructure-level incidents at Vercel, Supabase, or Stripe are managed by those providers under their own SOC 2 Type II and PCI DSS programs; however, this plan covers COOKIE-BANNER.CA’s response obligations when those incidents affect our customers.
