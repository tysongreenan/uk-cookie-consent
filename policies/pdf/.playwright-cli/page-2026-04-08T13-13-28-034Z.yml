        - 'checkbox "Prepare breach description: nature, categories of data, approximate number of records" [ref=e202]'
        - text: "Prepare breach description: nature, categories of data, approximate number of records"
    - listitem [ref=e203]:
      - generic [ref=e204]:
        - checkbox "Describe likely consequences and measures taken or proposed" [ref=e205]
        - text: Describe likely consequences and measures taken or proposed
    - listitem [ref=e206]:
      - generic [ref=e207]:
        - checkbox "File with relevant authorities within required timeframes" [ref=e208]
        - text: File with relevant authorities within required timeframes
    - listitem [ref=e209]:
      - generic [ref=e210]:
        - checkbox "Notify affected customers with clear, plain-language communication" [ref=e211]
        - text: Notify affected customers with clear, plain-language communication
    - listitem [ref=e212]:
      - generic [ref=e213]:
        - checkbox "Update the internal breach register" [ref=e214]
        - text: Update the internal breach register
  - separator [ref=e215]
  - heading "8. Communication Plan" [level=2] [ref=e216]
  - heading "Internal" [level=3] [ref=e217]
  - list [ref=e218]:
    - listitem [ref=e219]: Log all incident communications with timestamps.
    - listitem [ref=e220]: Use a dedicated incident channel (separate from day-to-day communications) if external contractors or legal counsel are involved.
  - heading "Customers" [level=3] [ref=e221]
  - list [ref=e222]:
    - listitem [ref=e223]: Email affected customers directly from security@cookie-banner.ca.
    - listitem [ref=e224]: "Include: what happened, what data was involved, what actions were taken, what customers should do (e.g., rotate API keys), and a contact point for questions."
    - listitem [ref=e225]: If the incident affects banner delivery, post a status update on the public status page.
  - heading "Authorities" [level=3] [ref=e226]
  - list [ref=e227]:
    - listitem [ref=e228]: Use official submission channels for each regulator (see Section 7).
    - listitem [ref=e229]: Retain copies of all submissions and correspondence.
  - heading "Third-Party Providers" [level=3] [ref=e230]
  - list [ref=e231]:
    - listitem [ref=e232]: Notify Supabase, Vercel, or Stripe if the incident involves their systems or requires their cooperation.
  - separator [ref=e233]
  - heading "9. Post-Incident Review" [level=2] [ref=e234]
  - paragraph [ref=e235]:
    - text: Within
    - strong [ref=e236]: 5 business days
    - text: "of incident resolution, conduct a post-incident review covering:"
  - list [ref=e237]:
    - listitem [ref=e238]:
      - strong [ref=e239]: Timeline
      - text: – What happened and when, from detection to resolution.
    - listitem [ref=e240]:
      - strong [ref=e241]: Root cause
      - text: – What allowed the incident to occur.
    - listitem [ref=e242]:
      - strong [ref=e243]: Response effectiveness
      - text: – What went well, what could be improved.
    - listitem [ref=e244]:
      - strong [ref=e245]: Action items
      - text: – Specific, assigned, time-bound improvements (e.g., add monitoring, tighten access controls, update this plan).
    - listitem [ref=e246]:
      - strong [ref=e247]: Lessons learned
      - text: – Document for future reference.
  - paragraph [ref=e248]: The review is documented in writing and stored alongside the incident record. Action items are tracked to completion.
