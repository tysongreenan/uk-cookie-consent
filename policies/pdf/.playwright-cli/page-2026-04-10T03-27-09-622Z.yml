                  - generic [ref=e3216]:
                    - textbox "Type your answer here..." [ref=e3218]: "All scoped data is stored internationally through third-party managed service providers. No data is stored internally or on-premise. Storage locations: - Supabase (Primary database) — AWS us-east-2 (Ohio, USA). Managed PostgreSQL with AES-256 encryption at rest, TLS 1.2+ in transit, and Row Level Security for tenant isolation. Supabase maintains SOC 2 Type II certification. - Vercel (Application hosting) — AWS-backed infrastructure, primarily US regions. Serverless functions process data in transit. Edge Network caches static assets globally but does not persist scoped data at edge nodes. Vercel maintains SOC 2 Type II certification. - Stripe (Payment processing) — US-based infrastructure. Handles billing metadata only (no consent data). PCI DSS Level 1 certified. Safeguards in place: - Encryption at rest (AES-256) and in transit (TLS 1.2+) for all data - Supabase Row Level Security enforces customer data isolation at the database level - MFA required on all administrative accounts - All providers operate under their published Data Processing Agreements - Quarterly access reviews of all provider accounts Data sovereignty considerations: - No jurisdiction currently requires us to store data within a specific country - Cross-border transfers from EU/UK are covered by providers' Standard Contractual Clauses (SCCs) - Canadian data stored in the US is permitted under PIPEDA, which allows transfers to jurisdictions with comparable protections provided adequate safeguards are in place"
