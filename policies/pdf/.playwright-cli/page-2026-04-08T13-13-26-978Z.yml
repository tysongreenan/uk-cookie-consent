  - paragraph [ref=e166]: Upon termination of any provider relationship, COOKIE-BANNER.CA will export or migrate data before the provider’s deletion timeline and confirm destruction of residual data in writing.
  - separator [ref=e167]
  - heading "6. Customer Data Deletion Requests" [level=2] [ref=e168]
  - paragraph [ref=e169]: "Customers and end users may request data deletion by contacting security@cookie-banner.ca. Requests are processed as follows:"
  - list [ref=e170]:
    - listitem [ref=e171]:
      - strong [ref=e172]: Acknowledgment
      - text: within 3 business days.
    - listitem [ref=e173]:
      - strong [ref=e174]: Completion
      - text: within 30 calendar days.
    - listitem [ref=e175]:
      - strong [ref=e176]: Verification
      - text: of requester identity before processing.
    - listitem [ref=e177]: Applies to all data categories unless a legal retention obligation overrides the request (see Section 8).
  - paragraph [ref=e178]: For GDPR data subjects, the right to erasure (Art. 17) is honored unless an exemption applies. For PIPEDA/Law 25 data subjects, withdrawal of consent and deletion requests are handled equivalently.
  - separator [ref=e179]
  - heading "7. Third-Party Data Handling" [level=2] [ref=e180]
  - paragraph [ref=e181]: "COOKIE-BANNER.CA requires that all sub-processors handle data destruction in accordance with their contractual obligations:"
  - list [ref=e182]:
    - listitem [ref=e183]:
      - strong [ref=e184]: "Supabase:"
      - text: Data deleted from production is removed from backups within 30 days via rolling retention.
    - listitem [ref=e185]:
      - strong [ref=e186]: "Stripe:"
      - text: Retains transaction data as required by PCI DSS and applicable tax law. COOKIE-BANNER.CA cannot force deletion of Stripe-held payment records but will cancel all associated customer objects.
    - listitem [ref=e187]:
      - strong [ref=e188]: "Vercel:"
      - text: Logs are purged automatically. No persistent customer personal data is stored at the Vercel layer.
  - separator [ref=e189]
  - heading "8. Exceptions and Legal Holds" [level=2] [ref=e190]
  - paragraph [ref=e191]: "Data may be retained beyond the standard periods when:"
  - list [ref=e192]:
    - listitem [ref=e193]:
      - text: Required by a
      - strong [ref=e194]: legal hold
      - text: (e.g., litigation, regulatory investigation, audit).
    - listitem [ref=e195]:
      - text: Needed to comply with
      - strong [ref=e196]: tax or financial reporting
      - text: obligations.
    - listitem [ref=e197]:
      - text: Subject to an
      - strong [ref=e198]: active dispute
      - text: or chargeback with a payment provider.
    - listitem [ref=e199]:
      - text: Required to demonstrate
      - strong [ref=e200]: proof of consent
      - text: under GDPR, PIPEDA, Law 25, or PECR.
  - paragraph [ref=e201]: Legal holds are authorized by the founder and documented with the scope, reason, and expected duration. Held data is destroyed within 30 days of the hold being lifted.
  - separator [ref=e202]
  - heading "9. Review Schedule" [level=2] [ref=e203]
  - paragraph [ref=e204]:
    - text: This policy is reviewed
    - strong [ref=e205]: annually
    - text: "or sooner if triggered by:"
  - list [ref=e206]:
    - listitem [ref=e207]: A change in applicable privacy legislation.
    - listitem [ref=e208]: A material change in infrastructure providers.
    - listitem [ref=e209]: A data breach or security incident.
    - listitem [ref=e210]: Significant changes to the types of data processed.
