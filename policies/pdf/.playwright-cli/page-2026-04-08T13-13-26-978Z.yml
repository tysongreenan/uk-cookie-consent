  - heading "4. Data Destruction Procedures" [level=2] [ref=e105]
  - heading "4.1 Automated Destruction" [level=3] [ref=e106]
  - list [ref=e107]:
    - listitem [ref=e108]:
      - strong [ref=e109]: Consent records
      - text: older than 3 years are purged by a scheduled database job that runs monthly.
    - listitem [ref=e110]:
      - strong [ref=e111]: Expired sessions
      - text: are cleared automatically by NextAuth.js on a rolling basis.
    - listitem [ref=e112]:
      - strong [ref=e113]: Application logs
      - text: expire automatically per Vercel’s 30-day log retention.
  - heading "4.2 Account Deletion" [level=3] [ref=e114]
  - paragraph [ref=e115]: "When a customer deletes their account or requests deletion:"
  - list [ref=e116]:
    - listitem [ref=e117]:
      - text: Account data, banner configurations, and team member records are deleted from the production database within
      - strong [ref=e118]: 30 days
      - text: .
    - listitem [ref=e119]:
      - text: Consent records collected on behalf of the customer are deleted within
      - strong [ref=e120]: 30 days
      - text: ", unless a legal retention obligation applies."
    - listitem [ref=e121]: Stripe customer and subscription objects are cancelled; Stripe retains transaction records per its own data retention obligations.
    - listitem [ref=e122]: A confirmation email is sent to the customer upon completion.
  - heading "4.3 Destruction Methods" [level=3] [ref=e123]
  - list [ref=e124]:
    - listitem [ref=e125]:
      - strong [ref=e126]: "Database records:"
      - text: Hard deletion via SQL
      - code [ref=e127]: DELETE
      - text: statements against Supabase PostgreSQL. No soft-delete retention beyond the stated periods.
    - listitem [ref=e128]:
      - strong [ref=e129]: "Backups:"
      - text: Supabase manages automated backup rotation on a 30-day rolling cycle. Deleted records naturally age out of the backup window.
    - listitem [ref=e130]:
      - strong [ref=e131]: "Logs:"
      - text: Vercel logs auto-expire. No manual destruction is required.
  - separator [ref=e132]
