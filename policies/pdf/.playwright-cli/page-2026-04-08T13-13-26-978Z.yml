  - heading "1. Purpose and Scope" [level=2] [ref=e10]
  - paragraph [ref=e11]: This policy defines how COOKIE-BANNER.CA retains, archives, and destroys data across its cookie consent management platform. It applies to all data processed by the organization and its infrastructure providers (Vercel, Supabase, Stripe). COOKIE-BANNER.CA operates as a fully virtual organization with no physical offices or on-premises data storage.
  - paragraph [ref=e12]: This policy supports compliance with GDPR, PIPEDA, Quebec Law 25, and PECR.
