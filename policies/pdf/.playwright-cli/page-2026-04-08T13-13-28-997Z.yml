  - heading "1. Purpose" [level=2] [ref=e11]
  - paragraph [ref=e12]: This policy defines how COOKIE-BANNER.CA identifies, evaluates, remediates, and tracks security vulnerabilities across its cookie consent management platform. It ensures a consistent, risk-based approach to vulnerability management appropriate for a small, fully remote SaaS operation.
  - heading "2. Scope" [level=2] [ref=e13]
  - paragraph [ref=e14]: "This policy applies to all systems, code, dependencies, and infrastructure that support the COOKIE-BANNER.CA platform, including:"
  - list [ref=e15]:
    - listitem [ref=e16]: Application source code (Next.js, React, TypeScript)
    - listitem [ref=e17]: Third-party dependencies (npm packages)
    - listitem [ref=e18]: Infrastructure services (Vercel, Supabase, Stripe, GitHub)
    - listitem [ref=e19]: Authentication systems (NextAuth.js)
    - listitem [ref=e20]: Database layer (Supabase PostgreSQL)
