  - heading "5. Dependency Management" [level=2] [ref=e107]
  - list [ref=e108]:
    - listitem [ref=e109]:
      - strong [ref=e110]: "Automated scanning:"
      - text: Dependabot is enabled on all repositories and configured to open pull requests for vulnerable dependencies automatically.
    - listitem [ref=e111]:
      - strong [ref=e112]: "Regular updates:"
      - text: Dependencies are reviewed and updated at minimum monthly. Security-critical updates are applied within the SLA for their severity level.
    - listitem [ref=e113]:
      - strong [ref=e114]: "Lock files:"
      - code [ref=e115]: package-lock.json
      - text: is committed to source control to ensure reproducible builds and prevent supply chain drift.
    - listitem [ref=e116]:
      - strong [ref=e117]: "Audit on build:"
      - code [ref=e118]: npm audit
      - text: runs as part of the CI pipeline; builds producing critical or high vulnerabilities are flagged for immediate review.
  - heading "6. Infrastructure Vulnerability Management" [level=2] [ref=e119]
  - paragraph [ref=e120]: "COOKIE-BANNER.CA operates as a fully cloud-hosted, serverless platform with no physical infrastructure. Infrastructure security is delegated to SOC 2 Type II certified providers:"
  - list [ref=e121]:
    - listitem [ref=e122]:
      - strong [ref=e123]: Vercel
      - text: – Application hosting, edge network, and SSL/TLS termination
    - listitem [ref=e124]:
      - strong [ref=e125]: Supabase
      - text: – PostgreSQL database, authentication services, and storage
    - listitem [ref=e126]:
      - strong [ref=e127]: Stripe
      - text: – Payment processing (PCI DSS Level 1 compliant)
    - listitem [ref=e128]:
      - strong [ref=e129]: GitHub
      - text: – Source control, CI/CD, and secrets management
  - paragraph [ref=e130]: Provider security postures are reviewed annually by verifying current SOC 2 reports and compliance certifications. Any provider security advisory affecting COOKIE-BANNER.CA is treated as an internal vulnerability and triaged per the SLAs above.
  - heading "7. Application Security" [level=2] [ref=e131]
  - paragraph [ref=e132]: "The development process incorporates the following application security practices:"
  - list [ref=e133]:
    - listitem [ref=e134]:
      - strong [ref=e135]: "OWASP Top 10 awareness:"
      - text: All code is developed with OWASP Top 10 risks in mind, including injection, broken authentication, sensitive data exposure, and security misconfiguration.
    - listitem [ref=e136]:
      - strong [ref=e137]: "Input validation:"
      - text: All user input and API request bodies are validated using Zod schemas before processing.
    - listitem [ref=e138]:
      - strong [ref=e139]: "Output encoding:"
      - text: Server-rendered content is escaped by default through React’s built-in XSS protections.
    - listitem [ref=e140]:
      - strong [ref=e141]: "Authentication and authorization:"
      - text: NextAuth.js manages session security. API routes enforce authorization checks before data access.
    - listitem [ref=e142]:
      - strong [ref=e143]: "Secrets management:"
      - text: All secrets are stored in environment variables managed through Vercel and GitHub; no secrets are committed to source control.
    - listitem [ref=e144]:
      - strong [ref=e145]: "Secure headers:"
      - text: HTTP security headers (CSP, HSTS, X-Frame-Options) are configured at the application and platform level.
  - heading "8. Patch Management Process" [level=2] [ref=e146]
  - list [ref=e147]:
    - listitem [ref=e148]:
      - strong [ref=e149]: Detection
      - text: – Vulnerability identified through any source listed in Section 3.
    - listitem [ref=e150]:
      - strong [ref=e151]: Triage
      - text: – Severity assessed using CVSS score; SLA clock starts.
    - listitem [ref=e152]:
      - strong [ref=e153]: Remediation
      - text: – Patch applied, dependency updated, or mitigation implemented.
    - listitem [ref=e154]:
      - strong [ref=e155]: Testing
      - text: – Fix verified in a preview/staging environment before production deployment.
    - listitem [ref=e156]:
      - strong [ref=e157]: Deployment
      - text: – Pushed to production via the standard CI/CD pipeline (GitHub to Vercel).
    - listitem [ref=e158]:
      - strong [ref=e159]: Verification
      - text: – Post-deployment check confirms the vulnerability is resolved.
    - listitem [ref=e160]:
      - strong [ref=e161]: Documentation
      - text: – Vulnerability and remediation recorded in the internal security log.
  - heading "9. Exception Handling" [level=2] [ref=e162]
  - paragraph [ref=e163]: "When a vulnerability cannot be remediated within its SLA, a risk acceptance exception is documented containing:"
  - list [ref=e164]:
    - listitem [ref=e165]: Vulnerability description and severity
    - listitem [ref=e166]: Reason remediation cannot be completed on schedule (e.g., no patch available, breaking dependency change)
    - listitem [ref=e167]: Compensating controls in place to reduce risk
    - listitem [ref=e168]: Revised target remediation date
    - listitem [ref=e169]: Acceptance approved by the Founder / Security Lead
  - paragraph [ref=e170]: Exceptions are reviewed monthly and closed as soon as a viable remediation path becomes available.
