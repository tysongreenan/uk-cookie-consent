        - cell "Maintaining platform-level security, publishing advisories, and providing SOC 2 attestations" [ref=e188]
  - paragraph [ref=e189]: As a solo-founder organization, all operational security responsibilities are held by the founder. If the team grows, this section will be updated to reflect delegated responsibilities.
  - heading "11. Reporting and Metrics" [level=2] [ref=e190]
  - paragraph [ref=e191]: "The following metrics are tracked quarterly:"
  - list [ref=e192]:
    - listitem [ref=e193]: Total vulnerabilities detected (by severity)
    - listitem [ref=e194]: Mean time to remediation (by severity)
    - listitem [ref=e195]: Number of open exceptions and their age
    - listitem [ref=e196]: Dependency update currency (percentage of dependencies on latest patch version)
  - paragraph [ref=e197]: A summary is maintained internally and made available upon request for compliance audits (GDPR, PIPEDA, Law 25, PECR).
  - heading "12. External Vulnerability Reporting" [level=2] [ref=e198]
  - paragraph [ref=e199]:
    - text: Security researchers and external parties can report vulnerabilities to
    - strong [ref=e200]: security@cookie-banner.ca
    - text: . Reports are acknowledged within 48 hours and triaged using the same severity classification and SLA framework defined in this policy.
  - heading "13. Review Schedule" [level=2] [ref=e201]
  - paragraph [ref=e202]:
    - text: This policy is reviewed and updated
    - strong [ref=e203]: semi-annually
    - text: ", or sooner if triggered by:"
  - list [ref=e204]:
    - listitem [ref=e205]: A significant security incident
    - listitem [ref=e206]: A material change in technology stack or infrastructure providers
    - listitem [ref=e207]: New regulatory requirements affecting GDPR, PIPEDA, Law 25, or PECR compliance
