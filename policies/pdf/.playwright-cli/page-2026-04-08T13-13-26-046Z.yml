  - table [ref=e174]:
    - rowgroup [ref=e179]:
      - row "Role Person Responsibilities" [ref=e180]:
        - columnheader "Role" [ref=e181]
        - columnheader "Person" [ref=e182]
        - columnheader "Responsibilities" [ref=e183]
    - rowgroup [ref=e184]:
      - row "Change Approver Founder Reviews and approves all changes; makes merge decisions; authorizes emergency changes" [ref=e185]:
        - cell "Change Approver" [ref=e186]:
          - strong [ref=e187]: Change Approver
        - cell "Founder" [ref=e188]
        - cell "Reviews and approves all changes; makes merge decisions; authorizes emergency changes" [ref=e189]
      - row "Change Implementer Founder Develops, tests, and deploys changes; writes documentation" [ref=e190]:
        - cell "Change Implementer" [ref=e191]:
          - strong [ref=e192]: Change Implementer
        - cell "Founder" [ref=e193]
        - cell "Develops, tests, and deploys changes; writes documentation" [ref=e194]
      - row "Incident Responder Founder Responds to production incidents; executes emergency changes and rollbacks" [ref=e195]:
        - cell "Incident Responder" [ref=e196]:
          - strong [ref=e197]: Incident Responder
        - cell "Founder" [ref=e198]
        - cell "Responds to production incidents; executes emergency changes and rollbacks" [ref=e199]
  - paragraph [ref=e200]: As a solo-founder organization, all roles are held by the same individual. This policy ensures disciplined process adherence despite the absence of a second reviewer by requiring documented checklists, PR descriptions, and post-deployment verification.
  - separator [ref=e201]
  - heading "12. Compliance Considerations" [level=2] [ref=e202]
  - paragraph [ref=e203]: Changes affecting consent collection, data processing, or data storage must account for obligations under GDPR, PIPEDA, Quebec Law 25, and PECR. Any change to how personal data is collected, stored, or processed must include a privacy impact note in the PR description.
  - separator [ref=e204]
