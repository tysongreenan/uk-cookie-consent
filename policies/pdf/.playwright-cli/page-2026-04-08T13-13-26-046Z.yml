  - paragraph [ref=e206]:
    - text: This policy is reviewed
    - strong [ref=e207]: annually
    - text: or whenever a material change occurs to the platform architecture, team structure, or regulatory requirements. The next scheduled review is
    - strong [ref=e208]: 2027-03-28
    - text: .
