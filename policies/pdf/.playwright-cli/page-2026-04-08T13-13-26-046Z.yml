  - separator [ref=e9]
  - heading "1. Purpose and Scope" [level=2] [ref=e10]
  - paragraph [ref=e11]: This policy establishes a formal change management process for all modifications to the COOKIE-BANNER.CA cookie consent management platform (CMP), including application code, infrastructure configuration, database schemas, and third-party integrations.
  - paragraph [ref=e12]: "It applies to all changes affecting the production environment: application deployments, database migrations, environment variable updates, DNS changes, Stripe configuration changes, and Supabase or Vercel settings modifications."
  - separator [ref=e13]
  - heading "2. Change Classification" [level=2] [ref=e14]
  - table [ref=e15]:
    - rowgroup [ref=e21]:
      - row "Classification Description Examples Approval" [ref=e22]:
        - columnheader "Classification" [ref=e23]
        - columnheader "Description" [ref=e24]
        - columnheader "Examples" [ref=e25]
        - columnheader "Approval" [ref=e26]
    - rowgroup [ref=e27]:
      - row "Standard Low-risk, routine changes following the established PR workflow Bug fixes, copy updates, dependency patches, UI tweaks Self-approved after PR checklist review" [ref=e28]:
        - cell "Standard" [ref=e29]:
          - strong [ref=e30]: Standard
        - cell "Low-risk, routine changes following the established PR workflow" [ref=e31]
