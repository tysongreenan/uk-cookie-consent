  - heading "1. Purpose" [level=2] [ref=e11]
  - paragraph [ref=e12]: This Risk Register identifies, assesses, and tracks information security and operational risks facing COOKIE-BANNER.CA, a cloud-native cookie consent management platform (CMP). It serves as the central record for risk management decisions and supports compliance obligations under GDPR, PIPEDA, Quebec Law 25, and PECR.
  - paragraph [ref=e13]: As a solo-founder, fully virtual organization with no physical infrastructure, the risk profile is shaped primarily by dependency on third-party cloud providers, the sensitivity of consent and customer data processed, and the concentration of operational knowledge in a single individual.
  - heading "2. Methodology" [level=2] [ref=e14]
  - paragraph [ref=e15]: "Risks are assessed using a qualitative likelihood-times-impact methodology:"
  - paragraph [ref=e16]:
    - strong [ref=e17]: Risk Score = Likelihood x Impact
